[project]
name = "gdparchis"
version = "1.1.0"
description = "Parchis board game made with Godot Engine"
authors = [
    {name = "turulomio", email = "turulomio@yahoo.es"}
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10,<4"
dependencies = []

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poetry (>=2.4.3,<3.0.0)"
]
